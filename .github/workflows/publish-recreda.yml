name: Publicar RecREdA y herramientas de radio

on:
  push:
    branches: [main]
    paths:
      - "RecREdA/**"
      - "*.html"
      - ".github/workflows/publish-recreda.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar sitio
        run: |
          mkdir -p public/RecREdA
          cp ./*.html public/
          cp -R RecREdA/. public/RecREdA/
          touch public/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos del sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
